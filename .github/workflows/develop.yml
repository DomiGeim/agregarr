name: Agregarr Develop

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - develop

jobs:
  test:
    name: Lint & Test Build
    runs-on: ubuntu-latest
    container: node:20.19.5-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apk add --no-cache \
            python3 make g++ gcc libc6-compat bash \
            build-base cairo-dev pango-dev jpeg-dev giflib-dev pixman-dev
      - name: Install dependencies
        env:
          HUSKY: 0
        run: yarn
      - name: Lint
        run: yarn lint
      - name: Type Check
        run: yarn typecheck
      - name: English locale audit
        run: yarn i18n:check-language-leaks
      - name: Formatting
        run: npx prettier --check .
      - name: Build
        run: yarn build

  build_and_push:
    name: Build ${{ matrix.platform }}
    if: github.event_name == 'push'
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            COMMIT_TAG=${{ github.sha }}
          outputs: type=image,name=ghcr.io/domigeim/agregarr,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          rm -rf /tmp/digests
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Create multi-platform manifest
    runs-on: ubuntu-latest
    needs: build_and_push
    permissions:
      packages: write
      contents: read
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest on GHCR
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/domigeim/agregarr:develop \
            $(printf 'ghcr.io/domigeim/agregarr@sha256:%s ' *)

      - name: Inspect images
        run: |
          docker buildx imagetools inspect ghcr.io/domigeim/agregarr:develop
          docker buildx imagetools inspect ghcr.io/domigeim/agregarr:develop | grep -q 'linux/amd64'
          docker buildx imagetools inspect ghcr.io/domigeim/agregarr:develop | grep -q 'linux/arm64'

  smoke:
    name: Smoke ${{ matrix.platform }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    needs: merge
    permissions:
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            expected_arch: x64
            port: 17171
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            expected_arch: arm64
            port: 17172
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start container and verify runtime
        env:
          IMAGE: ghcr.io/domigeim/agregarr:develop
          CONTAINER_NAME: agregarr-develop-smoke-${{ matrix.expected_arch }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
          PORT: ${{ matrix.port }}
        run: |
          set -euo pipefail
          cleanup() {
            docker logs --tail 120 "$CONTAINER_NAME" || true
            docker rm -f "$CONTAINER_NAME" || true
          }
          trap cleanup EXIT

          docker run -d \
            --name "$CONTAINER_NAME" \
            --platform "${{ matrix.platform }}" \
            -e TZ=UTC \
            -p "${PORT}:7171" \
            "$IMAGE"

          docker exec "$CONTAINER_NAME" node -e "require('sharp'); require('canvas'); console.log('native modules ok')"

          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${PORT}/api/v1/status" -o status.json; then
              break
            fi
            sleep 2
          done

          test -s status.json
          node <<'NODE'
          const fs = require('fs');
          const status = JSON.parse(fs.readFileSync('status.json', 'utf8'));
          const expectedArch = process.env.EXPECTED_ARCH;
          if (!status.runtime || status.runtime.arch !== expectedArch) {
            throw new Error(`Runtime arch mismatch: ${status.runtime?.arch} !== ${expectedArch}`);
          }
          if (!status.runtime.healthy) {
            throw new Error(`Runtime checks failed: ${JSON.stringify(status.runtime.checks)}`);
          }
          console.log(`Smoke OK: ${status.version} ${status.runtime.platform}/${status.runtime.arch}`);
          NODE

  discord:
    name: Send Discord Notification
    needs: smoke
    if: always() && github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Get Build Job Status
        uses: technote-space/workflow-conclusion-action@v3
      - name: Combine Job Status
        id: status
        run: |
          failures=(neutral, skipped, timed_out, action_required)
          if [[ ${array[@]} =~ $WORKFLOW_CONCLUSION ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          else
            echo "status=$WORKFLOW_CONCLUSION" >> $GITHUB_OUTPUT
          fi
      - name: Post Status to Discord
        if: steps.status.outputs.status == 'success'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_DEVELOP }}
          title: '✅ Agregarr Develop Build'
          description: |
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          color: 0x00ff00
          username: 'Agregarr Bot'
          url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          nofail: true
