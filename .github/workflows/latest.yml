name: Agregarr Release

on:
  push:
    branches:
      - latest

jobs:
  version-check:
    name: Check for new version
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check package version
        id: semantic
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "new_release_version=$version" >> "$GITHUB_OUTPUT"
          echo "new_release_published=true" >> "$GITHUB_OUTPUT"

  build_and_push:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: version-check
    if: needs.version-check.outputs.new_release_published == 'true'
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm version in package.json
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$package_version" != "${{ needs.version-check.outputs.new_release_version }}" ]; then
            echo "package.json version $package_version does not match release version ${{ needs.version-check.outputs.new_release_version }}"
            exit 1
          fi
          echo "Using package.json version $package_version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            COMMIT_TAG=${{ github.sha }}
          outputs: type=image,name=ghcr.io/domigeim/agregarr,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          rm -rf /tmp/digests
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Create multi-platform manifest
    runs-on: ubuntu-22.04
    needs:
      - version-check
      - build_and_push
    permissions:
      packages: write
      contents: read
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest on GHCR
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/domigeim/agregarr:latest \
            -t ghcr.io/domigeim/agregarr:v${{ needs.version-check.outputs.new_release_version }} \
            $(printf 'ghcr.io/domigeim/agregarr@sha256:%s ' *)

      - name: Inspect images
        run: |
          docker buildx imagetools inspect ghcr.io/domigeim/agregarr:latest

  release:
    name: Create release
    runs-on: ubuntu-22.04
    needs:
      - version-check
      - merge
    if: needs.version-check.outputs.new_release_published == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version-check.outputs.new_release_version }}
        run: |
          {
            echo "## Docker Images"
            echo
            echo '```sh'
            echo "docker pull ghcr.io/domigeim/agregarr:v${VERSION}"
            echo "docker pull ghcr.io/domigeim/agregarr:latest"
            echo '```'
            echo
            gh api repos/${GITHUB_REPOSITORY}/releases/generate-notes \
              -f tag_name="v${VERSION}" \
              -f target_commitish="${GITHUB_SHA}" \
              --jq .body
          } > release-notes.md

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release edit "v${VERSION}" \
              --target "${GITHUB_SHA}" \
              --title "Agregarr v${VERSION}" \
              --notes-file release-notes.md
          else
            gh release create "v${VERSION}" \
              --target "${GITHUB_SHA}" \
              --title "Agregarr v${VERSION}" \
              --notes-file release-notes.md
          fi

  discord:
    name: Discord Notification
    runs-on: ubuntu-22.04
    needs:
      - version-check
      - release
    steps:
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_LATEST }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Discord webhook not configured; skipping notification."
            exit 0
          fi

          curl -H "Content-Type: application/json" \
            -d '{
              "content": "@everyone",
              "embeds": [{
                "title": "Agregarr v${{ needs.version-check.outputs.new_release_version }} Released!",
                "description": "A new version of Agregarr is now available!\n\n**[View Release Notes](${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.version-check.outputs.new_release_version }})**",
                "color": 15105570,
                "fields": [
                  {"name": "Update your Docker image", "value": "```docker pull ghcr.io/domigeim/agregarr:v${{ needs.version-check.outputs.new_release_version }}\ndocker pull ghcr.io/domigeim/agregarr:latest```", "inline": false}
                ],
                "thumbnail": {"url": "https://raw.githubusercontent.com/DomiGeim/agregarr/develop/public/android-chrome-512x512.png"}
              }]
            }' \
            "$DISCORD_WEBHOOK"
